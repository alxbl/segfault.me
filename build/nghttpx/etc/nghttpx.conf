# Reverse proxy from nginx (HTTP/1.1, plain, private docker network) to the segv cluster Gateway (TLS).
# The frontend (plain HTTP on 3000) is added by the container when CERT_FILE/KEY_FILE are unset.
#
# origin.segfault.me exists only inside this container (extra_hosts in docker-compose.yaml, address from build/.env).
# It matches the Gateway's *.segfault.me certificate, so the backend certificate is verified without hard-coding an IP.
# The Gateway negotiates no ALPN (Cilium gatewayAPI.enableAlpn is off), so the backend hop is HTTP/1.1.
# Once ALPN is enabled on the Gateway, add ";proto=h2" to the backend to speak HTTP/2.
backend=origin.segfault.me,443;;tls
cacert=/etc/ssl/ca-certificates.crt

# nginx sets X-Forwarded-*; keep them instead of replacing them with nghttpx's view of the plain-HTTP hop.
no-strip-incoming-x-forwarded-proto=yes
no-add-x-forwarded-proto=yes

workers=1
log-level=WARN
