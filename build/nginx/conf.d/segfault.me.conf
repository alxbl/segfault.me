server {
    listen       80;
    listen  [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;

    server_name  segfault.me;

    ssl_certificate     /etc/nginx/certs/segfault.me.pem;
    ssl_certificate_key /etc/nginx/certs/segfault.me.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    access_log  /var/log/nginx/host.access.log  main;
    error_log /var/log/nginx/errors.log warn;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Keycloak runs in the segv cluster; nghttpx fronts it (see nghttpx/etc/nghttpx.conf).
    # The upstream is resolved per request (a variable defers it), so nginx starts, and the blog stays up, while
    # nghttpx is down; /auth/ then answers 502. 127.0.0.11 is docker's embedded DNS.
    location /auth/ {
        resolver 127.0.0.11 valid=10s;
        set $keycloak_upstream http://nghttpx:3000;
        proxy_pass $keycloak_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
    }

    # location ~ /photos {
    #     proxy_pass https://nghttpx:3000;
    #     proxy_set_header Host 'segfault.me';
    #     proxy_ssl_verify off;
    # }

    error_page  404              /404.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}