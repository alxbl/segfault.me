version: '2.4'
services:
  nginx:
    image: nginx:latest
    # sslh (build/sslh/sslh) forwards TLS here from the host's port 443.
    ports:
      - 127.0.0.1:4443:443
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ../public:/usr/share/nginx/html:ro
    restart: unless-stopped

  nghttpx:
    image: dajobe/nghttpx:latest
    # As PID 1 nghttpx ignores SIGTERM and is SIGKILLed after 10s at shutdown.
    init: true
    volumes:
      - ./nghttpx:/data
      # The image ships no CA bundle.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/ca-certificates.crt:ro
    extra_hosts:
      - origin.segfault.me:${SEGV_ORIGIN_IP:?set in build/.env}
    # No CERT_FILE/KEY_FILE: the frontend is plain HTTP, reachable only from nginx on the compose network.
    restart: unless-stopped